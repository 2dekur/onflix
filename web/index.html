<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Onflix</title>
<link rel="icon" type="image/svg+xml" href="logo.svg">
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css">
</head>
<body>

<nav id="nav">
  <div class="nav-logo">
    <svg width="30" height="30" viewBox="0 0 100 100">
      <defs>
        <linearGradient id="lg" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#F87171"/>
          <stop offset="100%" stop-color="#F97316"/>
        </linearGradient>
        <mask id="m"><circle cx="50" cy="50" r="46" fill="white"/><circle cx="50" cy="50" r="27" fill="black"/></mask>
      </defs>
      <circle cx="50" cy="50" r="46" fill="url(#lg)" mask="url(#m)"/>
      <polygon points="44,36 44,64 68,50" fill="white" opacity="0.9"/>
    </svg>
    <span>Onflix</span>
  </div>
  <div class="nav-links">
    <button data-page="home" class="active">Accueil</button>
    <button data-page="movies">Films</button>
    <button data-page="series">Séries</button>
    <button data-page="anime">Animé</button>
  </div>
  <div class="nav-right">
    <label class="search-box">
      <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="search-input" type="text" placeholder="Rechercher…" autocomplete="off">
    </label>
  </div>
</nav>

<main id="main">
  <div id="page-home">
    <div id="hero" onclick="app.playHero()">
      <img id="hero-img" src="" alt="">
      <div id="hero-grad"></div>
      <div id="hero-info">
        <div id="hero-badge">À LA UNE</div>
        <h1 id="hero-title"></h1>
        <p id="hero-desc"></p>
        <div id="hero-actions">
          <button class="btn-primary" onclick="event.stopPropagation();app.playHero()">
            <svg width="14" height="14" fill="currentColor" viewBox="0 0 20 20"><path d="M6.3 2.841A1.5 1.5 0 004 4.11V15.89a1.5 1.5 0 002.3 1.269l9.344-5.89a1.5 1.5 0 000-2.538L6.3 2.84z"/></svg>
            Regarder
          </button>
          <button class="btn-ghost" onclick="event.stopPropagation();app.playHeroInfo()">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
            Détails
          </button>
        </div>
      </div>
    </div>
    <div id="rows"></div>
  </div>

  <div id="page-search" class="hidden">
    <h2 id="search-heading"></h2>
    <div id="search-grid" class="card-grid"></div>
  </div>
</main>

<!-- DETAIL -->
<div id="modal-detail" class="overlay" onclick="if(event.target===this)app.closeDetail()">
  <div class="modal-box">
    <button class="close-btn" onclick="app.closeDetail()">✕</button>
    <div class="detail-hero-wrap">
      <img id="d-backdrop" src="" alt="">
      <div class="detail-hero-fade"></div>
    </div>
    <div class="detail-content">
      <div class="detail-left">
        <img id="d-poster" src="" alt="">
      </div>
      <div class="detail-right">
        <h2 id="d-title"></h2>
        <div id="d-meta" class="meta-row"></div>
        <p id="d-desc"></p>
        <div id="d-actions"></div>
      </div>
    </div>
    <div id="d-seasons"></div>
  </div>
</div>

<!-- SOURCE PICKER -->
<div id="modal-source" class="overlay" onclick="if(event.target===this)app.closeSource()">
  <div class="modal-box source-modal">
    <h3 id="src-title"></h3>
    <p id="src-sub" class="meta-row" style="font-size:.82rem;margin-bottom:12px"></p>
    <div id="src-list"></div>
    <button class="btn-cancel" onclick="app.closeSource()">Annuler</button>
  </div>
</div>

<!-- PLAYER -->
<div id="player">
  <div id="player-top">
    <button class="player-btn" onclick="app.closePlayer()">
      <svg width="18" height="18" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
    </button>
    <span id="player-title"></span>
    <button class="player-btn" onclick="app.toggleFS()" title="Plein écran">
      <svg width="18" height="18" fill="currentColor" viewBox="0 0 24 24"><path d="M7 14H5v5h5v-2H7v-3zm-2-4h2V7h3V5H5v5zm12 7h-3v2h5v-5h-2v3zM14 5v2h3v3h2V5h-5z"/></svg>
    </button>
  </div>
  <div id="player-wrap">
    <video id="vid" controls playsinline></video>
    <iframe id="emb" allowfullscreen allow="autoplay; encrypted-media; fullscreen; picture-in-picture" style="display:none"></iframe>
  </div>
  <div id="dl-bar">
    <div id="dl-track"><div id="dl-fill" style="width:0"></div></div>
    <div id="dl-info"><span id="dl-text">Connexion…</span><span id="dl-peers"></span></div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/webtorrent@1.9.7/webtorrent.min.js"></script>
<script src="tmdb.js"></script>
<script src="sources.js"></script>
<script src="app.js"></script>
</body>
</html>
